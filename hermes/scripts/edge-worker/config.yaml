# Hermes Edge Worker Configuration
# 本机作为主节点，监听所有网络接口

worker:
  name: "charlesdeMacBook-Pro"
  host: "0.0.0.0"  # 监听所有接口
  port: 9001
  brain_url: ""
  auto_discover: true
  discover_interval: 30
  heartbeat_interval: 30
  reconnect_interval: 10

security:
  token: "hermes-edge-2024"  # 设置认证token
  allowed_commands: []  # 空=允许所有
  max_timeout: 300

logging:
  level: "info"
  file: "/Users/charles/.hermes/edge-worker/logs/edge.log"
  max_size: "10MB"
  max_files: 5

updates:
  auto_check: false
  check_interval: 0
  source: "local"

update_sources:
  primary: "local"
  fallbacks:
    - "github:https://raw.githubusercontent.com/nicholaschenai/hermes-edge-worker/main"
    - "github-proxy:https://ghproxy.com/https://raw.githubusercontent.com/nicholaschenai/hermes-edge-worker/main"
    - "cloudflare:https://hermes-edge.pages.dev"
